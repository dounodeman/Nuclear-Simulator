[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reactorsim"
version = "0.1.0"
description = "Physics-first nuclear reactor simulator, starting with Purdue's PUR-1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
reactorsim = "reactorsim.cli:main"

[tool.setuptools.packages.find]
include = ["reactorsim*"]

[tool.pytest.ini_options]
markers = ["slow: long-running scenario tests"]
