name: macOS app
# Builds "PUR-1 Simulator.app" on Apple silicon and, for main, publishes it as a GitHub
# Release tagged build-<run number>. The installed app checks the latest release and updates
# itself (reactorsim/app/updates.py).
on:
  push:
    branches: [main]
    paths:
      - "reactorsim/**"
      - "models/export/**"
      - "packaging/macos/**"
      - "pyproject.toml"
      - ".github/workflows/macos-app.yml"
  pull_request:
    paths:
      - "reactorsim/app/**"
      - "packaging/macos/**"
      - ".github/workflows/macos-app.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      ASSET: PUR-1-Simulator-macOS.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp the build number
        run: |
          cat > reactorsim/_build.py <<EOF
          """Build stamp written by the macOS release workflow."""

          BUILD = ${{ github.run_number }}
          COMMIT = "${{ github.sha }}"
          EOF
      - name: Install
        run: pip install ".[mac,dev]"
      - name: App tests
        run: python -m pytest -q tests/test_app.py
      - name: Icon
        run: python packaging/macos/make_icon.py
      - name: Package
        run: pyinstaller packaging/macos/pur1.spec --noconfirm --distpath dist --workpath build
      - name: Smoke test the packaged app
        run: '"dist/PUR-1 Simulator.app/Contents/MacOS/PUR-1 Simulator" --selftest'
      - name: Zip
        run: ditto -c -k --keepParent "dist/PUR-1 Simulator.app" "$ASSET"
      - uses: actions/upload-artifact@v4
        with:
          name: PUR-1-Simulator-macOS
          path: ${{ env.ASSET }}
          retention-days: 14
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          git log -1 --format='%s%n%n%b' > notes.txt
          echo "Commit ${GITHUB_SHA::7}" >> notes.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --title "PUR-1 Simulator build ${{ github.run_number }}" \
              --notes-file notes.txt --target "$GITHUB_SHA" --latest
          fi
